[project]
name = "reach"
version = "0.1.0"
description = "Reach: community infrastructure knowledge platform. Twilio voice/SMS + web map -> Azure Functions (ASGI) -> SQL."
requires-python = "==3.12.*"
dependencies = [
    "azure-functions>=1.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "anthropic>=1.15",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tts = ["torch", "transformers", "soundfile", "huggingface-hub"]
azure = ["pyodbc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    "types-PyYAML",
    "jsonschema",
    "types-jsonschema",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["api"]
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Header", "fastapi.Depends", "fastapi.Body"]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["reach"]
omit = ["api/reach/speech/mms.py", "api/reach/ingest/*"]

[tool.mypy]
python_version = "3.12"
mypy_path = "api"
packages = ["reach"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["transformers.*", "soundfile", "torch.*", "azure.functions.*", "huggingface_hub.*"]
ignore_missing_imports = true

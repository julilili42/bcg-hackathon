[project]
name = "reach-gateway"
version = "0.1.0"
description = "Phone-in water point status line: Twilio voice/SMS -> Azure Function -> SQL. Swahili + English."
requires-python = "==3.12.*"
dependencies = [
    "azure-functions",
    "pyodbc",
    "torch",
    "transformers",
    "soundfile",
    "huggingface-hub",
    "anthropic>=1.15.0",
    "qdrant-client>=1.19.1",
    "fastembed>=0.9.0",
    "langgraph>=1.2.15",
    "langchain-anthropic>=1.7.6",
    "google-genai>=2.31.0",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reach Line Phone</title>
<link rel="stylesheet" href="/api/phone/static/phone.css">
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.5/dist/twilio.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <img src="/api/phone/static/nokia3310.png" alt="Nokia 3310" draggable="false">
    <div class="lcd" id="lcd" aria-live="polite">
      <div class="lcd-top"><span class="sig">▮▮▮▮</span><span id="lcd-status"></span><span class="bat">▮▮▮</span></div>
      <div class="lcd-main" id="lcd-main"></div>
      <div class="lcd-soft" id="lcd-soft">Call</div>
    </div>
    <!-- hit areas over the real keys, percentages measured on the photo -->
    <button class="hit navi" id="key-navi" style="left:31%;top:51.3%;width:38.5%;height:5.8%" aria-label="Call"></button>
    <button class="hit" id="key-c" style="left:16.5%;top:54.2%;width:18.5%;height:7.5%" aria-label="Hang up or clear"></button>
    <button class="hit" id="key-prev" style="left:56.5%;top:54.5%;width:13.5%;height:9.8%" aria-label="Scroll up"></button>
    <button class="hit" id="key-next" style="left:70%;top:54.5%;width:13.5%;height:9.8%" aria-label="Scroll down"></button>
    <button class="hit" data-digit="1" style="left:13%;top:64.8%;width:18.5%;height:5.6%">1</button>
    <button class="hit" data-digit="2" style="left:40.5%;top:66.5%;width:19.5%;height:5.6%">2</button>
    <button class="hit" data-digit="3" style="left:69%;top:64.8%;width:18.5%;height:5.6%">3</button>
    <button class="hit" data-digit="4" style="left:13.8%;top:71.8%;width:18.5%;height:5.6%">4</button>
    <button class="hit" data-digit="5" style="left:40.5%;top:73.6%;width:19.5%;height:5.6%">5</button>
    <button class="hit" data-digit="6" style="left:68.2%;top:71.8%;width:18.5%;height:5.6%">6</button>
    <button class="hit" data-digit="7" style="left:15%;top:78.9%;width:18.5%;height:5.6%">7</button>
    <button class="hit" data-digit="8" style="left:40.5%;top:80.6%;width:19.5%;height:5.6%">8</button>
    <button class="hit" data-digit="9" style="left:67%;top:78.9%;width:18.5%;height:5.6%">9</button>
    <button class="hit" data-digit="*" style="left:15.8%;top:85.9%;width:18.5%;height:5.6%">*</button>
    <button class="hit" data-digit="0" style="left:40.5%;top:87.7%;width:19.5%;height:5.6%">0</button>
    <button class="hit" data-digit="#" style="left:66%;top:85.9%;width:18.5%;height:5.6%">#</button>
  </div>

  <aside class="panel" aria-label="Live data">
    <header><h1>Reach Line</h1><span class="num" id="num">+1 865 459 8142</span></header>
    <section>
      <h2>Water points <span class="live-dot" title="live"></span><span class="hint">live, every 2 s</span></h2>
      <table class="wp"><thead><tr><th>Name</th><th>Village</th><th>Status</th><th>Updated</th></tr></thead><tbody id="wp"></tbody></table>
    </section>
    <section>
      <h2>Last calls <span class="hint">Navi = call · C = hang up · 2 = English</span></h2>
      <ol id="log"></ol>
    </section>
  </aside>
</div>
<script src="/api/phone/static/phone.js"></script>
</body>
</html>

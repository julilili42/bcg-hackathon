<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reach Line Phone</title>
<link rel="stylesheet" href="/api/phone/static/phone.css">
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.5/dist/twilio.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="scaler">
    <div class="nokia3310" id="phone">
      <div class="nokia-head-container">
        <div class="speaker"><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div></div>
        <div class="logo">NOKIA</div>
        <div class="screen-container" id="lcd" aria-live="polite">
          <div class="lcd-top"><span id="lcd-signal">▮▮▮▮</span><span id="lcd-status">…</span><span id="lcd-batt">▮▮▮</span></div>
          <div class="lcd-main" id="lcd-main"></div>
          <div class="lcd-soft" id="lcd-soft">Call</div>
        </div>
        <div class="bottom-oval">
          <button class="big button top" id="key-navi" aria-label="Call"></button>
        </div>
      </div>
      <div class="bottom-buttons">
        <button class="big button left" id="key-c" aria-label="End or clear"><span>C</span></button>
        <button class="big button right" aria-label="Scroll"><span id="key-prev">&#8249;</span><span id="key-next">&#8250;</span></button>
      </div>
      <div class="keyboard" id="keyboard">
        <div class="button-key-container"><button class="button-key left" data-digit="1"><span class="special">1</span><span class="minitext compact">o_o</span></button></div>
        <div class="button-key-container"><button class="button-key middle" data-digit="2"><span class="special">2</span><span class="minitext">abc</span></button></div>
        <div class="button-key-container invert"><button class="button-key right" data-digit="3"><span class="special">3</span><span class="minitext">def</span></button></div>
        <div class="button-key-container"><button class="button-key left" data-digit="4"><span class="special">4</span><span class="minitext">ghi</span></button></div>
        <div class="button-key-container"><button class="button-key middle" data-digit="5"><span class="special">5</span><span class="minitext">jkl</span></button></div>
        <div class="button-key-container invert"><button class="button-key right" data-digit="6"><span class="special">6</span><span class="minitext">mno</span></button></div>
        <div class="button-key-container"><button class="button-key left" data-digit="7"><span class="special">7</span><span class="minitext">pqrs</span></button></div>
        <div class="button-key-container"><button class="button-key middle" data-digit="8"><span class="special">8</span><span class="minitext">tuv</span></button></div>
        <div class="button-key-container invert"><button class="button-key right" data-digit="9"><span class="special">9</span><span class="minitext">wxyz</span></button></div>
        <div class="button-key-container"><button class="button-key left" data-digit="*"><span class="special">*</span><span class="minitext">+</span></button></div>
        <div class="button-key-container"><button class="button-key middle" data-digit="0"><span class="special">0</span><span class="minitext rotate">[</span></button></div>
        <div class="button-key-container invert"><button class="button-key right" data-digit="#"><span class="special">#</span><span class="minitext home"></span></button></div>
      </div>
    </div>
  </div>
  <aside class="log" aria-label="Live transcript">
    <h2>Live</h2>
    <p class="hint">Navi key = call · C = hang up · 2 = English · digits send tones</p>
    <ol id="log"></ol>
  </aside>
</div>
<script src="/api/phone/static/phone.js"></script>
</body>
</html>

name: ci

on:
  push:
    branches: [main, lorenz]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: api
      TWILIO_VALIDATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: lint
        run: |
          uv run ruff format --check api
          uv run ruff check api
      - name: types
        run: uv run mypy
      - name: tests
        run: uv run pytest --cov=reach --cov-report=xml --cov-fail-under=80
      - name: smoke against a live server
        run: |
          export DATABASE_URL="sqlite:///$PWD/data/ci.db"
          uv run python -m reach.ingest.seed --reset
          uv run uvicorn reach.app:create_app --factory --port 7071 &
          for i in $(seq 1 20); do curl -sf http://localhost:7071/api/health >/dev/null && break; sleep 0.5; done
          scripts/smoke.sh http://localhost:7071
      - name: schema file is current
        run: |
          uv run python scripts/dump_schema.py | diff - api/reach/storage/schema.sql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
